openapi: 3.0.0
info:
  title: Booking Service API
  version: 1.0.0
  description: Complete API documentation for booking service

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: BOOKING
  - name: ADMIN

paths:
  /bookings:
    get:
      summary: Get list of bookings
      tags: [BOOKING]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, updated_at]
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, completed]
        - name: create_from
          in: query
          schema:
            type: string
            format: date-time
        - name: create_to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of bookings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /bookings/check-price:
    post:
      summary: Check price and prepare booking (creates draft in cache)
      tags: [BOOKING]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickup
                - dropoff
                - vehicle_type
                - distance_km
              properties:
                pickup:
                  type: string
                dropoff:
                  type: string
                note:
                  type: string
                  maxLength: 500
                promotion_id:
                  type: string
                vehicle_type:
                  type: string
                  enum: [car, motorbike]
                distance_km:
                  type: number
                  format: float
      responses:
        '200':
          description: Price calculated and booking draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Only renters can prepare bookings
        '422':
          description: Validation error
        '500':
          description: Internal server error

  /bookings/{id}:
    get:
      summary: Get booking details by ID
      tags: [BOOKING]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Booking not found
        '500':
          description: Internal server error

  /bookings/{id}/find-driver:
    post:
      summary: Match driver to pending booking (PENDING → CONFIRMED)
      description: Rate limited to 5 requests
      tags: [BOOKING]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Driver matched, booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Invalid booking ID
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Booking not found
        '409':
          description: Booking not in PENDING status
        '422':
          description: Invalid booking data
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
        '503':
          description: Service unavailable

  /admin/bookings:
    get:
      summary: Get list of all bookings (Admin only)
      tags: [ADMIN]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, updated_at]
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, completed]
        - name: phone
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [renter, driver]
        - name: create_from
          in: query
          schema:
            type: string
            format: date-time
        - name: create_to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of bookings retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin only
        '500':
          description: Internal server error

components:
  schemas:
    BookingListResponse:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/BookingResponse'
        pagination:
          type: object
          properties:
            current_page:
              type: integer
            items_per_page:
              type: integer
            total_items:
              type: integer
            total_pages:
              type: integer

    BookingResponse:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439011"
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
          example: "CONFIRMED"
        vehicleType:
          type: string
          enum: [car, motorbike]
          example: "car"
        renterId:
          type: string
        driverId:
          type: string
        pickup:
          type: string
        dropoff:
          type: string
        note:
          type: string
        baseAmount:
          type: integer
          format: int64
        discountAmount:
          type: integer
          format: int64
        totalAmount:
          type: integer
          format: int64
        promotionId:
          type: string
        cancelBy:
          type: string
          enum: [RENTER, DRIVER]
        cancelReason:
          type: string
        cancelAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        driver:
          $ref: '#/components/schemas/DriverInfo'
        renter:
          $ref: '#/components/schemas/RenterInfo'
    
    DriverInfo:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        avatar:
          type: string
          format: uri
        rating:
          type: number
          format: float

    RenterInfo:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
  
